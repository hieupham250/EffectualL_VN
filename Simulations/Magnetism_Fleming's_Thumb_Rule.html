<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fleming's right hand thumb's rule</title>
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />
    <link
      rel="shortcut icon"
      href="../files/favicon_white.ico"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="shortcut icon"
      href="../files/favicon.ico"
      media="(prefers-color-scheme: light)"
    />
    <link rel="stylesheet" type="text/css" href="../css/style-page.css" />
    <!-- Google tag (gtag.js) -->

      async
      src="https://www.googletagmanager.com/gtag/js?id=G-0JWHY29KD2"
    ></script>

      function gtag() {
        dataLayer.push(arguments);

      gtag("js", new Date());

      gtag("config", "G-0JWHY29KD2");
    </script>
    <meta
      name="google-site-verification"
      content="mz0TRB59UNqdTxhwzmXmGdgVPh8pB4YqjuUr-aWNGIY"
    />

  <body>
    <div id="container">
      <div id="topmenu">
        <div>
          <span data-i18n="applying_fleming"
            >Applying Fleming's right hand thumb's rule to a current carrying
            WIRE/COIL</span
          ><br />
          <button
            style="background-color: rgb(3, 67, 97)"
            id="conductor-el"
            data-i18n="wire"
          >
            WIRE
          </button>
          <button
            style="background-color: rgb(3, 108, 156)"
            id="coil-el"
            data-i18n="coil"
          >
            COIL
          </button>
        </div>
      </div>

      <div id="sidemenu">
        <div style="display: none" id="rule-el">
          <a style="cursor: pointer; color: red" id="close"
            ><span>&#10006;</span></a
          >
          <h4>
            <p data-i18n="thumb">Thumb :- Current Direction;</p>
            <p data-i18n="fingers">Fingers :- Magnetic Field;</p>
            <p data-i18n="points_towards">
              &#10687; : Points towards the viewer
            </p>
            <p data-i18n="points_away">
              &#11199; : Points away from the viewer
            </p>
          </h4>
        </div>
      </div>
    </div>

    <div id="menu">
      <button id="current-el" data-i18n="reverse_current">
        REVERSE CURRENT
      </button>
      <button id="hand-el" data-i18n="hand_gesture">HAND GESTURE</button>
      <button id="mflines-el" data-i18n="magnetic_field_lines">
        MAGNETIC FIELD LINES</button
      ><br />
      <a id="message-el" data-i18n="current_direction_up"
        >Current direction in the conductor UP
      </a>
    </div>

    <script type="module">
      import * as THREE from "../build/three.module.js";
      import { OrbitControls } from "../jsm/controls/OrbitControls.js";
      import { GLTFLoader } from "../jsm/loaders/GLTFLoader.js";
      import Stats from "../jsm/libs/stats.module.js";

      let model, mixer, camera, controls;
      let loop = false;
      let flow = 1;
      let coilflow = 1;
      let hand,
        wire,
        coil,
        mfwire,
        arrow,
        arrow1,
        mfcoil,
        mfviewReverse,
        mfviewForward;
      const modelPath = "./model/";
      const RULES = {
        Rule: "thumbsrule.glb",
      };
      let actions = [];
      let message = "";
      let messageEl = document.getElementById("message-el");
      let ruleEl = document.getElementById("rule-el");
      let close = document.getElementById("close");

      //scene
      // const document.body = document.getElementById( "document.body" );
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xbfd1e5);

      //camera
      camera = new THREE.PerspectiveCamera(
        35,
        window.innerWidth / window.innerHeight,
        0.001,
        1000
      );
      camera.position.set(0, 3, 3);
      //camera.rotation.set(-26, 0, 0);
      const stats = new Stats();
      const clock = new THREE.Clock();
      document.body.appendChild(stats.dom);
      //renderer
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.shadowMap.enabled = true;
      //document.body.appendChild( renderer.domElement );
      document.body.appendChild(renderer.domElement);

      //cameracontrols
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enablePan = true;
      controls.enableZoom = true;
      controls.target.set(0, 0, 0);
      controls.update();

      //create light
      let hemiLight = new THREE.AmbientLight(0xffffff, 0.2);
      hemiLight.position.set(0, 20, 0);
      scene.add(hemiLight);

      let dirLight = new THREE.DirectionalLight(0xffffff, 1);
      dirLight.position.set(-30, 50, -30);
      dirLight.castShadow = true;
      dirLight.shadow.camera.top = 70;
      dirLight.shadow.camera.bottom = -70;
      dirLight.shadow.camera.left = -70;
      dirLight.shadow.camera.right = 70;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      scene.add(dirLight);

      const buttonconductorEl = document.getElementById("conductor-el");
      const buttoncoilEl = document.getElementById("coil-el");
      const buttoncurrentEl = document.getElementById("current-el");
      const buttonhandEl = document.getElementById("hand-el");
      const buttonmflinesEl = document.getElementById("mflines-el");

      //load rule1
      //rule1Model();
      const map1 = new THREE.TextureLoader().load(
        "./assets/Magformula/mfviewReverse.png"
      );
      const material1 = new THREE.SpriteMaterial({ map: map1 });

      mfviewReverse = new THREE.Sprite(material1);
      mfviewReverse.scale.set(0.5, 0.2, 0.5);

      const map2 = new THREE.TextureLoader().load(
        "./assets/Magformula/mfviewForward.png"
      );
      const material2 = new THREE.SpriteMaterial({ map: map2 });

      mfviewForward = new THREE.Sprite(material2);
      mfviewForward.scale.set(0.5, 0.2, 0.5);
      //currentFlow( );

      const loader = new GLTFLoader();
      loader.setPath(modelPath).load(RULES["Rule"], function (gltf) {
        model = gltf.scene;
        hand = model.getObjectByName("Armature");
        wire = model.getObjectByName("wire");
        coil = model.getObjectByName("coil");
        arrow = model.getObjectByName("arrow");
        mfwire = model.getObjectByName("MFwire");
        arrow1 = model.getObjectByName("arrow1");
        mfcoil = model.getObjectByName("MFcoil");

        gltf.scene.traverse((child) => {
          if (child.type == "SkinnedMesh") {
            child.frustumCulled = false;
          }
        });
        scene.add(wire);
        mixer = new THREE.AnimationMixer(model);
        let loopAnim = [
          "straight",
          "direction",
          "loop",
          "loopAnti",
          "loopClock",
          "anticoilthumb",
        ];

        let ruleAnim = ["ThumbRule", "handReverse", "wireloop"];

        renderer.render(scene, camera);

        for (let i = 0; i < gltf.animations.length; i++) {
          let clip = gltf.animations[i];
          let action = mixer.clipAction(clip);
          actions[clip.name] = action;

          if (ruleAnim.indexOf(clip.name) >= 0) {
            action.clampWhenFinished = true;
            action.loop = THREE.LoopOnce;
          }
        }
        scene.add(arrow);

        actions["straight"].setDuration(1).play();
        animate();
        buttonconductorEl.addEventListener("click", function () {
          actions["loopClock"].stop();
          actions["wireloop"].stop();
          actions["handReverse"].stop().reset();
          actions["ThumbRule"].stop().reset();
          actions["loop"].stop();
          actions["anticoilthumb"].stop();
          actions["direction"].stop();
          actions["straight"].stop();
          actions["loopAnti"].stop();
          camera.position.set(0, 3, 3);
          camera.rotation.set(0, 0, 0);
          controls.target.set(0, 0, 0);
          conductorModel();
        });

        buttoncoilEl.addEventListener("click", function () {
          actions["loopClock"].stop();
          actions["wireloop"].stop();
          actions["handReverse"].stop();
          actions["ThumbRule"].stop();
          actions["loop"].stop();
          actions["anticoilthumb"].stop();
          actions["direction"].stop();
          actions["straight"].stop();
          actions["loopAnti"].stop();
          camera.position.set(0.5, 0.75, 2.5);
          controls.target.set(0.5, 0, 0.2);

          conductorModel();
        });

        buttoncurrentEl.addEventListener("click", function () {
          actions["loopClock"].stop();
          //actions['wireloop'].stop();
          actions["handReverse"].stop();
          actions["ThumbRule"].stop();
          actions["loop"].stop();
          actions["anticoilthumb"].stop();
          actions["direction"].stop();
          actions["straight"].stop();
          actions["loopAnti"].stop();
          //actions['mfdirectionSwitch'].stop();

          currentFlow();
        });

        buttonhandEl.addEventListener("click", function () {
          actions["handReverse"].stop().reset();
          actions["ThumbRule"].stop().reset();
          actions["loop"].stop().reset();
          actions["anticoilthumb"].stop().reset();

          //actions['mfdirectionSwitch'].stop();

          handModel();
        });

        buttonmflinesEl.addEventListener("click", function () {
          ruleEl.style.display = "block";
          mflinesModel();
        });
        close.addEventListener("click", function () {
          ruleEl.style.display = "none";
        });

        window.addEventListener("resize", onWindowResize);
      });

      function conductorModel() {
        if (loop === false) {
          scene.remove(wire);
          scene.remove(hand);
          scene.remove(arrow);
          scene.remove(mfwire);
          scene.remove(mfviewReverse);
          scene.remove(mfviewForward);
          scene.remove(mfcoil);
          scene.add(coil);

          buttonconductorEl.style.backgroundColor = "rgb(3, 108, 156)";
          buttoncoilEl.style.backgroundColor = "rgb(3, 67, 97)";
          //actions['wireloop'].reset();
          actions["wireloop"].setDuration(1).play();
          setTimeout(function () {
            if (coilflow === 1) {
              scene.add(arrow1);
              actions["loopClock"].setDuration(1).play();
              coilflow = -1;

              message = i18next.t("current_direction_loop_clockwise");
              messageEl.textContent = message;
              animate();
            } else if (coilflow === -1) {
              scene.add(arrow1);
              actions["loopAnti"].setDuration(1).play();

              coilflow = 1;
              message = i18next.t("current_direction_loop_counter_clockwise");
              messageEl.textContent = message;
              animate();
            }
          }, 1000);
          loop = true;
        } else if (loop === true) {
          scene.remove(coil);
          scene.remove(hand);
          scene.remove(arrow1);
          scene.remove(mfwire);
          scene.remove(mfviewReverse);
          scene.remove(mfviewForward);
          scene.remove(mfcoil);
          scene.add(wire);
          scene.add(arrow);
          buttonconductorEl.style.backgroundColor = "rgb(3, 67, 97)";
          buttoncoilEl.style.backgroundColor = "rgb(3, 108, 156)";
          actions["straight"].setDuration(1).play();
          loop = false;
          flow = 1;
          message = i18next.t("current_direction_up");
          messageEl.textContent = message;
          animate();
        }
      }

      function currentFlow() {
        if (loop === false && flow === 1) {
          scene.remove(hand);
          scene.remove(mfwire);
          scene.remove(mfcoil);
          scene.remove(mfviewReverse);
          scene.remove(mfviewForward);
          actions["direction"].setDuration(1).play();
          flow = -1;

          message = i18next.t("current_direction_down");
          messageEl.textContent = message;
          animate();
        } else if (loop === false && flow === -1) {
          scene.remove(hand);
          scene.remove(mfwire);
          scene.remove(mfcoil);
          scene.remove(mfviewReverse);
          scene.remove(mfviewForward);
          actions["straight"].setDuration(1).play();

          flow = 1;
          message = i18next.t("current_direction_up");
          messageEl.textContent = message;
          animate();
        }
        if (loop === true && coilflow === 1) {
          scene.remove(hand);
          scene.remove(mfwire);
          scene.remove(mfcoil);
          scene.remove(mfviewReverse);
          scene.remove(mfviewForward);
          actions["loopClock"].setDuration(1).play();
          coilflow = -1;

          message = i18next.t("current_direction_loop_clockwise");
          messageEl.textContent = message;
          animate();
        } else if (loop === true && coilflow === -1) {
          scene.remove(hand);
          scene.remove(mfwire);
          scene.remove(mfcoil);
          scene.remove(mfviewReverse);
          scene.remove(mfviewForward);
          actions["loopAnti"].setDuration(1).play();

          coilflow = 1;
          message = i18next.t("current_direction_loop_counter_clockwise");
          messageEl.textContent = message;
          animate();
        }
      }

      function handModel() {
        if (loop === false && flow === 1) {
          scene.add(hand);
          actions["ThumbRule"].play();

          message = i18next.t("thumb_show_up");
          messageEl.textContent = message;
          animate();
        } else if (loop === false && flow === -1) {
          scene.add(hand);

          actions["handReverse"].play();

          message = i18next.t("thumb_show_down");
          messageEl.textContent = message;
          animate();
        } else if (loop === true && coilflow === 1) {
          scene.add(hand);

          actions["anticoilthumb"].setDuration(10).play();

          message = i18next.t("thumb_shows_text");
          messageEl.textContent = message;
          animate();
        } else if (loop === true && coilflow === -1) {
          scene.add(hand);
          actions["loop"].setDuration(10).play();

          message = i18next.t("thumb_shows_text");
          messageEl.textContent = message;
          animate();
        }
      }

      function mflinesModel() {
        if (loop === false && flow === 1) {
          setTimeout(function () {
            scene.add(mfwire);
            mfwire.rotation.set(0, 0, 0);
            scene.add(mfviewForward);
          }, 500);

          message = i18next.t("anticlockwise_text");
          messageEl.textContent = message;
          animate();
        } else if (loop === false && flow === -1) {
          setTimeout(function () {
            scene.add(mfwire);
            mfwire.rotation.set(3.14, 0, 0);
            scene.add(mfviewReverse);
          }, 500);

          message = i18next.t("clockwise_text");
          messageEl.textContent = message;
          animate();
        } else if (loop === true && coilflow === 1) {
          setTimeout(function () {
            scene.add(mfcoil);
            mfcoil.rotation.set(0, 0, 0);
            setTimeout(function () {
              fieldRotation();
            }, 500);
          }, 500);

          message = i18next.t("anticlockwise_center_text");
          messageEl.textContent = message;
          animate();
        } else if (loop === true && coilflow === -1) {
          setTimeout(function () {
            scene.add(mfcoil);
            mfcoil.rotation.set(3.14, 0, 0);
            setTimeout(function () {
              fieldRotation();
            }, 500);
          }, 500);

          message = i18next.t("clockwise_center_text");
          messageEl.textContent = message;
          animate();
        }
      }

      function fieldRotation() {
        requestAnimationFrame(fieldRotation);
        mfcoil.rotation.z += 0.01;
        renderer.render(scene, camera);
      }

      //window resizing

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();

        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();

        mixer.update(delta);

        controls.update();

        stats.update();

        renderer.render(scene, camera);
      }
    </script>

    <script src="https://unpkg.com/i18next@23.5.0/i18next.min.js"></script>
    <script type="module" src="/i18n/index_i18n.js"></script>
  </body>
</html>
